<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <meta name="theme-color" content="#0f172a" />
  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="apple-touch-icon" href="icon-192.png" />
  <title>Captura O₂ – Crianza</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
    :root { --bg:#0f172a; --panel:#1e293b; --panel2:#334155; --line:#334155; --txt:#e2e8f0; --mut:#94a3b8;
            --blue:#3b82f6; --green:#22c55e; --amber:#f59e0b; --red:#ef4444; }
    html, body { height: 100%; }
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
           background: var(--bg); color: var(--txt); overscroll-behavior: none;
           padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left); }
    .app { max-width: 640px; margin: 0 auto; min-height: 100%; display: flex; flex-direction: column; }

    /* Header */
    .top { position: sticky; top: 0; z-index: 5; background: var(--bg); border-bottom: 1px solid var(--line);
           padding: 12px 16px; display: flex; align-items: center; gap: 10px; }
    .top h1 { font-size: 1.05rem; font-weight: 750; flex: 1; }
    .net { display: inline-flex; align-items: center; gap: 6px; font-size: .74rem; color: var(--mut); }
    .net .dot { width: 9px; height: 9px; border-radius: 50%; background: var(--green); }
    .net.off .dot { background: var(--mut); }
    .subbar { display: flex; gap: 8px; padding: 8px 16px; font-size: .76rem; color: var(--mut);
              border-bottom: 1px solid var(--line); align-items: center; flex-wrap: wrap; }
    .badge { background: var(--panel); border: 1px solid var(--line); border-radius: 999px; padding: 3px 10px; }
    .badge b { color: var(--txt); }
    .badge.warn { border-color: var(--amber); color: var(--amber); }
    .warn-banner { background: rgba(245,158,11,.16); border-bottom: 1px solid var(--amber);
                   color: #fbbf24; font-size: .82rem; font-weight: 650; padding: 10px 16px; text-align: center; }

    section { padding: 16px; flex: 1; }
    .hidden { display: none !important; }

    /* Dashboard */
    .progress-card { background: var(--panel); border: 1px solid var(--line); border-radius: 16px; padding: 16px; margin-bottom: 14px; }
    .progress-top { display: flex; justify-content: space-between; align-items: baseline; margin-bottom: 10px; }
    .progress-top .n { font-size: 1.6rem; font-weight: 800; }
    .progress-top .l { color: var(--mut); font-size: .82rem; }
    .bar { height: 10px; background: var(--panel2); border-radius: 999px; overflow: hidden; }
    .bar > i { display: block; height: 100%; background: var(--green); width: 0; transition: width .3s; }
    .row { display: flex; gap: 10px; }
    .btn { flex: 1; border: none; border-radius: 14px; padding: 16px; font-size: 1rem; font-weight: 750;
           cursor: pointer; color: #fff; display: inline-flex; align-items: center; justify-content: center; gap: 8px; }
    .btn:active { transform: scale(.98); }
    .btn-scan { background: var(--blue); }
    .btn-sync { background: var(--panel2); }
    .btn-ghost { background: transparent; color: var(--mut); border: 1px solid var(--line); }
    .btn-lg { font-size: 1.1rem; padding: 18px; }
    .mt { margin-top: 12px; }

    .list-title { font-size: .74rem; text-transform: uppercase; letter-spacing: .06em; color: var(--mut); font-weight: 700; margin: 20px 4px 8px; }
    .pond { display: flex; align-items: center; gap: 12px; background: var(--panel); border: 1px solid var(--line);
            border-radius: 12px; padding: 13px 14px; margin-bottom: 8px; cursor: pointer; }
    .pond:active { background: var(--panel2); }
    .pond .status { width: 12px; height: 12px; border-radius: 50%; background: var(--panel2); flex-shrink: 0; }
    .pond.done .status { background: var(--green); }
    .pond .info { flex: 1; min-width: 0; }
    .pond .pn { font-weight: 700; }
    .pond .un { font-size: .78rem; color: var(--mut); }
    .pond .chev { color: var(--mut); }
    .pond.done .pn::after { content: " ✓"; color: var(--green); }

    /* Capture */
    .cap-pond { text-align: center; margin-bottom: 18px; }
    .cap-pond .pn { font-size: 1.7rem; font-weight: 800; }
    .cap-pond .un { color: var(--mut); font-size: .9rem; }
    .field { margin-bottom: 16px; }
    .field label { display: block; font-size: .82rem; color: var(--mut); font-weight: 650; margin-bottom: 6px; }
    .field input { width: 100%; background: var(--panel); border: 2px solid var(--line); border-radius: 14px;
                   color: var(--txt); font-size: 1.7rem; font-weight: 700; padding: 14px 16px; text-align: center;
                   font-variant-numeric: tabular-nums; outline: none; }
    .field input:focus { border-color: var(--blue); }
    .field .unit { color: var(--mut); font-weight: 500; font-size: 1rem; }
    .live { background: var(--panel); border: 1px solid var(--line); border-radius: 14px; padding: 14px 16px; margin-bottom: 16px;
            display: flex; align-items: center; justify-content: space-between; }
    .live .k { color: var(--mut); font-size: .82rem; }
    .live .v { font-size: 1.15rem; font-weight: 800; font-variant-numeric: tabular-nums; }
    .pill { display: inline-block; padding: 5px 12px; border-radius: 999px; font-size: .82rem; font-weight: 800; }
    .p-ok { background: rgba(34,197,94,.15); color: var(--green); }
    .p-alerta { background: rgba(245,158,11,.15); color: var(--amber); }
    .p-alarma { background: rgba(239,68,68,.18); color: var(--red); }
    .p-none { background: var(--panel2); color: var(--mut); }
    textarea { width: 100%; background: var(--panel); border: 1px solid var(--line); border-radius: 12px;
               color: var(--txt); font-size: .95rem; padding: 10px 12px; outline: none; font-family: inherit; }

    /* Scanner */
    .scanwrap { position: relative; background:#000; border-radius: 16px; overflow: hidden; aspect-ratio: 3/4; }
    #video { width: 100%; height: 100%; object-fit: cover; }
    .scan-frame { position: absolute; inset: 18%; border: 3px solid rgba(255,255,255,.85); border-radius: 18px; }
    .scan-hint { text-align: center; color: var(--mut); margin: 14px 0; font-size: .9rem; }

    .toast { position: fixed; left: 50%; bottom: 22px; transform: translateX(-50%); background: #0b1220;
             border: 1px solid var(--line); color: var(--txt); padding: 12px 18px; border-radius: 12px;
             font-size: .9rem; box-shadow: 0 8px 30px rgba(0,0,0,.5); opacity: 0; transition: opacity .2s; z-index: 50; max-width: 90%; }
    .toast.show { opacity: 1; }
    .toast.ok { border-color: var(--green); } .toast.err { border-color: var(--red); }
    .empty { color: var(--mut); text-align: center; padding: 30px; }
  </style>
</head>
<body>
<div class="app">
  <div class="top">
    <h1>Captura O₂</h1>
    <span class="net" id="net"><span class="dot"></span><span id="net-txt">en línea</span></span>
  </div>
  <div class="subbar">
    <span class="badge" id="sync-badge">Sin subir: <b id="pending-n">0</b></span>
    <span class="badge" id="boot-badge">Datos: <b id="boot-when">—</b></span>
  </div>
  <div class="warn-banner hidden" id="nopersist">⚠ Este equipo no guarda datos localmente. Sincroniza antes de cerrar la app.</div>

  <!-- Dashboard -->
  <section id="view-dash">
    <div class="progress-card">
      <div class="progress-top">
        <div><span class="n" id="prog-n">0/0</span> <span class="l">esta ronda</span></div>
        <button class="btn btn-ghost" id="btn-newround" style="flex:0 0 auto; padding:8px 14px; font-size:.85rem">Nueva ronda</button>
      </div>
      <div class="bar"><i id="prog-bar"></i></div>
    </div>
    <div class="row">
      <button class="btn btn-scan btn-lg" id="btn-scan">📷 Escanear estanque</button>
    </div>
    <div class="row mt">
      <button class="btn btn-sync" id="btn-sync">Sincronizar</button>
      <button class="btn btn-ghost" id="btn-refresh" style="flex:0 0 auto; padding:16px 18px">↻ Datos</button>
    </div>
    <div class="list-title">Estanques · toca para ingresar</div>
    <div id="pond-list"></div>
    <div class="empty hidden" id="no-data">Sin datos. Conéctate a la red de la base y toca "↻ Datos".</div>
  </section>

  <!-- Capture -->
  <section id="view-cap" class="hidden">
    <div class="cap-pond">
      <div class="pn" id="cap-pn">—</div>
      <div class="un" id="cap-un">—</div>
    </div>
    <div class="field">
      <label>Oxígeno disuelto <span class="unit">mg/L</span></label>
      <input id="in-do" type="number" inputmode="decimal" step="0.01" placeholder="0.00" />
    </div>
    <div class="field">
      <label>Temperatura <span class="unit">°C</span></label>
      <input id="in-temp" type="number" inputmode="decimal" step="0.1" placeholder="0.0" />
    </div>
    <div class="live">
      <div><div class="k">Saturación estimada</div><div class="v" id="live-sat">—</div></div>
      <span class="pill p-none" id="live-alarm">—</span>
    </div>
    <div class="field">
      <label>Observación <span class="unit">opcional</span></label>
      <textarea id="in-obs" rows="2" placeholder="Notas…"></textarea>
    </div>
    <div class="row">
      <button class="btn btn-ghost" id="btn-cancel" style="flex:0 0 40%">Cancelar</button>
      <button class="btn btn-scan" id="btn-save">Guardar</button>
    </div>
  </section>

  <!-- Scanner -->
  <section id="view-scan" class="hidden">
    <div class="scanwrap"><video id="video" playsinline muted></video><div class="scan-frame"></div></div>
    <div class="scan-hint" id="scan-hint">Apunta al QR del estanque…</div>
    <button class="btn btn-ghost" id="btn-scan-cancel">Cancelar</button>
  </section>
</div>

<div class="toast" id="toast"></div>
<script src="app.js"></script>
</body>
</html>
