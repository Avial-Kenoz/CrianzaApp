{# Estilos comunes de las vistas nuevas de alimentación (pedidos). #}
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: #f0f2f5; color: #1a1a2e; min-height: 100vh; }
  header { background: #111827; color: #fff; padding: 16px 22px; display: flex; align-items: center; gap: 14px; flex-wrap: wrap; }
  header h1 { font-size: 1.1rem; font-weight: 700; }
  header a { color: #9ca3af; font-size: .82rem; text-decoration: none; }
  header a:hover { color: #fff; }
  .who { margin-left: auto; display: flex; align-items: center; gap: 8px; font-size: .82rem; color: #d1d5db; }
  .who select { padding: 6px 8px; border-radius: 7px; border: 1px solid #374151; background: #1f2937; color: #fff; font-size: .82rem; }
  .container { padding: 14px 14px 40px; max-width: 1280px; }
  .flash { border-radius: 10px; padding: 10px 12px; font-size: .86rem; margin-bottom: 12px; }
  .flash.info { color: #1e3a8a; background: #eef6ff; border: 1px solid #bfdbfe; }
  .flash.warn { color: #9a3412; background: #fff7ed; border: 1px solid #fdba74; }
  .flash.ok { color: #115e59; background: #f0fdfa; border: 1px solid #99f6e4; }
  .note { font-size: .8rem; color: #4b5563; margin-bottom: 12px; line-height: 1.5; }
  .card { background: #fff; border-radius: 12px; box-shadow: 0 1px 6px rgba(0,0,0,.08); margin-bottom: 12px; overflow: hidden; }
  .card-head { padding: 12px 16px 8px; display: flex; align-items: baseline; gap: 10px; flex-wrap: wrap; }
  .card-head h2 { font-size: 1rem; font-weight: 700; }
  .card-head .sub { font-size: .8rem; color: #4b5563; }
  .tbl-wrap { overflow-x: auto; }
  table { width: 100%; border-collapse: collapse; font-size: .82rem; }
  th { text-align: right; font-size: .7rem; text-transform: uppercase; letter-spacing: .03em; color: #6b7280; font-weight: 700; padding: 6px 10px; border-bottom: 1px solid #e5e7eb; white-space: nowrap; }
  td { text-align: right; padding: 7px 10px; border-bottom: 1px solid #f3f4f6; white-space: nowrap; }
  th.l, td.l { text-align: left; }
  td.wrap { white-space: normal; }
  tfoot td { font-weight: 700; border-top: 1px solid #e5e7eb; }
  .muted { color: #9ca3af; }
  .neg { color: #b91c1c; font-weight: 700; }
  .alto { color: #b45309; font-weight: 700; }
  .pill { font-size: .72rem; font-weight: 700; border-radius: 9px; padding: 2px 8px; display: inline-block; }
  .pill.emitido { background: #fef3c7; color: #92400e; }
  .pill.salio { background: #ccfbf1; color: #115e59; }
  .pill.anulado { background: #f3f4f6; color: #6b7280; text-decoration: line-through; }
  .btn { border: none; border-radius: 8px; font-size: .82rem; font-weight: 700; padding: 8px 14px; cursor: pointer; text-decoration: none; display: inline-block; }
  .btn:disabled { background: #9ca3af !important; cursor: not-allowed; }
  .btn-primary { background: #0f766e; color: #fff; }
  .btn-primary:hover { background: #0b5f59; }
  .btn-light { background: #fff; color: #374151; border: 1px solid #d1d5db; }
  .btn-light:hover { border-color: #0f766e; }
  .btn-danger { background: #fff; color: #b91c1c; border: 1px solid #fca5a5; }
  .toast { position: fixed; bottom: 20px; right: 20px; padding: 12px 18px; border-radius: 10px; font-size: .87rem; font-weight: 700; box-shadow: 0 4px 16px rgba(0,0,0,.18); z-index: 9999; display: none; color: #fff; }
  .toast.ok { background: #0f766e; } .toast.err { background: #b91c1c; }
</style>
