<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Configuración – Crianza</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
           background: #f0f2f5; color: #1a1a2e; min-height: 100vh; }
    .page { padding: 26px 30px 60px; max-width: 860px; }
    .page-title { font-size: 1.45rem; font-weight: 750; }
    .page-sub { color: #6b7280; font-size: .86rem; margin: 2px 0 22px; }
    .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 16px; }
    .sec { display: flex; gap: 14px; align-items: flex-start; text-decoration: none; color: inherit;
           background: #fff; border: 1px solid #e5e7eb; border-radius: 14px; padding: 18px 20px;
           transition: transform .08s, box-shadow .12s, border-color .12s; }
    .sec:hover { transform: translateY(-2px); box-shadow: 0 8px 22px rgba(0,0,0,.07); border-color: #bfdbfe; }
    .sec .ic { font-size: 1.7rem; line-height: 1; }
    .sec .t { font-size: 1.02rem; font-weight: 700; }
    .sec .d { font-size: .84rem; color: #6b7280; margin-top: 4px; }
    .empty { background: #fff; border: 1px dashed #d7dbe0; border-radius: 14px; padding: 40px; text-align: center; color: #9ca3af; }
  </style>
</head>
<body>
{% include '_sidebar.html' %}
<div class="page">
  <div class="page-title">Configuración</div>
  <div class="page-sub">Ajustes del sistema</div>

  <div class="grid">
    {% for s in sections %}
    <a class="sec" href="{{ s.url }}">
      <div class="ic">{{ s.icon }}</div>
      <div>
        <div class="t">{{ s.title }}</div>
        <div class="d">{{ s.desc }}</div>
      </div>
    </a>
    {% endfor %}
    {% if not sections %}<div class="empty">No hay secciones de configuración disponibles.</div>{% endif %}
  </div>
</div>
</div></div>
</body>
</html>
